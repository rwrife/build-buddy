# build-buddy sample config
# Copy to build-buddy.local.toml (gitignored) to customize.

[source]
# "local" runs a shell command and maps its exit code to a mood.
# "github" (M6) polls a repo's latest GitHub Actions run.
kind = "local"

[local]
# The command build-buddy runs on an interval. Exit 0 = happy, non-zero = sad.
command = "npm test"
# How often to run it, in seconds.
interval = 30
# Max seconds to let the command run before treating it as failed.
timeout = 120

[window]
# Starting position of the little always-on-top window (pixels from top-left).
x = 40
y = 40
# Critter size in pixels.
size = 96
always_on_top = true

[pet]
# Which critter to show: "duck", "cat", or "ghost".
skin = "duck"
