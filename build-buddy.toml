# build-buddy sample config
# Copy to build-buddy.local.toml (gitignored) to customize. If the local file
# defines [[sources]], that list replaces this sample list.

# Each source gets an independent always-on-top buddy window.
[[sources]]
id = "local-tests"
name = "Local tests"
kind = "local"
command = "npm test"
cwd = "."
interval = 30
timeout = 120
skin = "duck"
x = 40
y = 40

[[sources]]
id = "build-buddy-ci"
name = "Build Buddy CI"
kind = "github"
repo = "rwrife/build-buddy"
interval = 60
skin = "cat"
# x/y are optional. Unpositioned buddies use a non-overlapping grid.

[pet]
# Skin for the dashboard buddy: "duck", "cat", or "ghost".
skin = "duck"
